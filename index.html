<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una sorpresa para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Outfit:wght@400;500&family=Pinyon+Script&family=Young+Serif&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens de color (claro / oscuro) ---------- */
  :root{
    --bg:#E6F0FF; --bg2:#F7FAFF; --ink:#2E4A7D; --muted:#5D7299;
    --accent:#7FA9EC; --accent-ink:#FFFFFF; --ring:rgba(127,169,236,.45);
    --stem:#9FCFB8; --leaf:#BFE3D0;
    --card:#FBFDFF; --card-line:rgba(127,169,236,.35); --key:#EEF4FF; --bad:#E58AA6; --good:#6FBF9E;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#141E36; --bg2:#1D2B4C; --ink:#E4EDFF; --muted:#A8BCE2;
      --accent:#9CC0F5; --accent-ink:#141E36; --ring:rgba(156,192,245,.4);
      --stem:#6FA48C; --leaf:#5E907A;
      --card:#1F2E52; --card-line:rgba(156,192,245,.3); --key:#2A3C66; --bad:#F2A3BC; --good:#8FD6B8;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#141E36; --bg2:#1D2B4C; --ink:#E4EDFF; --muted:#A8BCE2;
    --accent:#9CC0F5; --accent-ink:#141E36; --ring:rgba(156,192,245,.4);
    --stem:#6FA48C; --leaf:#5E907A;
      --card:#1F2E52; --card-line:rgba(156,192,245,.3); --key:#2A3C66; --bad:#F2A3BC; --good:#8FD6B8;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0;min-height:100%;
    background:radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%);
    background-color:var(--bg);
    color:var(--ink);
    font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow-x:hidden;
  }

  /* ---------- Campo de flores (fondo) ---------- */
  #field{position:fixed;left:0;right:0;bottom:0;width:100%;height:46vh;z-index:0;pointer-events:none}
  .stem{fill:none;stroke:var(--stem);stroke-width:4;stroke-linecap:round;
        stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--d) ease-out forwards}
  .leaf{fill:var(--leaf);opacity:0;animation:fade .8s calc(var(--d) + .7s) ease-out forwards}
  .bloom{transform-box:fill-box;transform-origin:center;transform:scale(0);
         animation:bloom .9s calc(var(--d) + 1.1s) cubic-bezier(.3,1.6,.5,1) forwards}
  .sprig{transform-box:view-box;animation:sway var(--sway) ease-in-out infinite alternate}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  @keyframes bloom{to{transform:scale(1)}}
  @keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}

  /* ---------- Pétalos cayendo ---------- */
  .petal{position:fixed;top:-6vh;width:var(--s);height:var(--s);background:var(--c);
         border-radius:80% 0 80% 0;opacity:.75;z-index:0;pointer-events:none;
         animation:fall var(--t) linear var(--delay) infinite}
  @keyframes fall{
    0%{transform:translate(0,0) rotate(0)}
    50%{transform:translate(var(--drift),55vh) rotate(200deg)}
    100%{transform:translate(0,112vh) rotate(400deg)}
  }

  /* ---------- Layout ---------- */
  main{position:relative;z-index:1;min-height:100vh;min-height:100svh;
       display:grid;place-items:center;padding:24px 20px 32px}
  .hero{text-align:center;max-width:34rem;transition:opacity .5s ease, transform .5s ease}
  .hero.leaving{opacity:0;transform:translateY(-24px) scale(.97)}
  .hero h1{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;
           font-size:clamp(2.6rem,9vw,4.6rem);line-height:1.02;margin:0 0 .4em;letter-spacing:-.01em}
  .hero .love{font-family:"Pinyon Script",cursive;font-size:clamp(2.2rem,8vw,3.2rem);
              color:var(--accent);margin:0 0 .1em;line-height:1}
  .hero p{font-size:1.1rem;color:var(--muted);margin:0 auto 2.2rem;max-width:26ch;line-height:1.5}

  .btn{font:inherit;font-weight:500;font-size:1.05rem;border:0;cursor:pointer;
       padding:1rem 1.9rem;border-radius:999px;background:var(--accent);color:var(--accent-ink);
       box-shadow:0 10px 26px var(--ring);position:relative;transition:transform .2s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px) scale(.98)}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
  .btn:disabled{opacity:.7;cursor:progress}
  /* Anillo que late para invitar a tocar */
  .reveal::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px solid var(--accent);
                 animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}

  /* ---------- Boleta ---------- */
  .stage{display:none;flex-direction:column;align-items:center;gap:22px}
  /* Saludo de cumpleaños sobre el fondo, encima de la boleta */
  .bday{font-family:"Pinyon Script",cursive;font-weight:400;font-size:clamp(2.4rem,9vw,4rem);
        line-height:1.1;margin:0;text-align:center;color:var(--ink);opacity:0;
        text-shadow:0 2px 18px var(--ring)}
  .stage.show .bday{animation:bday 1s ease-out .15s forwards}
  @keyframes bday{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
  .stage.show{display:flex}

  /* Mazo: ambas boletas apiladas en la misma celda */
  .deck{display:grid;width:min(360px,82vw,calc((100svh - 310px) * .6));opacity:0;touch-action:pan-y}
  .stage.show .deck{animation:arrive 1.15s cubic-bezier(.2,.9,.25,1.12) forwards,
                              float 5s ease-in-out 1.3s infinite alternate}
  .ticket{grid-area:1/1;position:relative;filter:drop-shadow(0 24px 38px rgba(46,74,125,.30))}
  .ticket img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  .shine{position:absolute;inset:0;border-radius:5% / 3%;overflow:hidden;pointer-events:none}
  .shine::before{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;
                 background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
                 transform:skewX(-12deg)}
  .stage.show #t0 .shine::before{animation:sweep 1.2s ease-in-out 1.1s forwards}
  .ticket.sweep .shine::before{animation:sweep 1.1s ease-in-out .5s forwards !important}
  @keyframes arrive{
    0%{opacity:0;transform:translateY(55vh) rotate(-12deg) scale(.82)}
    60%{opacity:1}
    100%{opacity:1;transform:none}
  }
  @keyframes float{from{transform:translateY(0) rotate(-.6deg)}to{transform:translateY(-8px) rotate(.6deg)}}
  @keyframes sweep{from{left:-60%}to{left:130%}}

  /* Botón ojito sobre el campo "Monto" del bono */
  .eye{position:absolute;left:82.8%;top:56.3%;transform:translate(-50%,-50%);
       width:clamp(30px,10%,42px);aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;
       background:#FFFFFF;color:#2E4A7D;display:grid;place-items:center;
       box-shadow:0 4px 12px rgba(46,74,125,.28);transition:transform .2s ease}
  .eye:hover{transform:translate(-50%,-50%) scale(1.08)}
  .eye:focus-visible{outline:3px solid #2E4A7D;outline-offset:3px}
  .eye svg{width:58%;height:58%}
  .eye.hint::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #7FA9EC;
                   animation:pulse 1.8s ease-out infinite}
  .eye.pop{animation:pop .4s ease}
  @keyframes pop{50%{transform:translate(-50%,-50%) scale(1.25)}}

  /* Indicador de páginas */
  .dots{display:flex;gap:8px;justify-content:center}
  .dot{width:8px;height:8px;border-radius:999px;background:var(--muted);opacity:.35;transition:all .3s ease}
  .dot.on{width:22px;opacity:1;background:var(--accent)}

  .actions{display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;
           transition:opacity .6s ease 1.2s}
  .stage.show .actions{opacity:1}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
  .status{min-height:1.4em;margin:0;font-size:.95rem;color:var(--muted);text-align:center;max-width:30ch}


  /* ---------- Modal con slides ---------- */
  .modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;
         padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));
         background:rgba(30,48,90,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
         opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
  .modal.open{opacity:1;visibility:visible;transition:opacity .35s ease}
  .card{position:relative;width:min(420px,100%);max-height:100%;overflow:auto;
        background:var(--card);color:var(--ink);border-radius:30px;padding:34px 24px 24px;
        box-shadow:0 30px 70px rgba(30,48,90,.35), inset 0 0 0 1.5px var(--card-line);
        transform:translateY(40px) scale(.94);transition:transform .5s cubic-bezier(.2,.9,.25,1.12)}
  .modal.open .card{transform:none}
  .card.shake{animation:shake .45s ease}
  @keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  .corner{position:absolute;width:96px;height:96px;pointer-events:none}
  .corner.tl{top:-14px;left:-14px}
  .corner.br{bottom:-14px;right:-14px;transform:rotate(180deg)}
  .close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;
         background:transparent;color:var(--muted);font-size:1.5rem;line-height:1;cursor:pointer;z-index:2}
  .close:focus-visible{outline:2px solid var(--ink)}
  .mdots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
  .mdot{width:7px;height:7px;border-radius:999px;background:var(--muted);opacity:.3;transition:all .3s ease}
  .mdot.on{width:20px;opacity:1;background:var(--accent)}

  .slides{display:grid}
  .slide{grid-area:1/1;display:flex;flex-direction:column;align-items:center;text-align:center;
         transition:opacity .45s ease,transform .45s ease,visibility 0s}
  .slide:not(.active){opacity:0;transform:translateX(40px);visibility:hidden;pointer-events:none;
                      transition:opacity .3s ease,transform .3s ease,visibility 0s linear .3s}
  .slide.gone{transform:translateX(-40px)}
  .slide h3{font-family:"Pinyon Script",cursive;font-weight:400;font-size:2.6rem;margin:0 0 .3em;line-height:1.1}
  .msg{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;font-size:1.12rem;
       line-height:1.6;margin:0 0 1.6rem}
  .msg span{opacity:0;display:inline-block;transform:translateY(6px)}
  .slide.active .msg span{animation:word .5s ease forwards}
  @keyframes word{to{opacity:1;transform:none}}

  /* Juego del código */
  .lock{width:64px;height:64px;margin-bottom:6px}
  .lock .shackle{transform-box:view-box;transform-origin:44px 30px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
  .lock.open .shackle{transform:translateY(-6px) rotate(28deg)}
  .code-title{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:1.3rem;margin:0 0 1.1rem;max-width:20ch;line-height:1.25}
  .slots{display:flex;gap:12px;justify-content:center;margin-bottom:10px}
  .slot{width:52px;height:60px;border-radius:16px;display:grid;place-items:center;
        font-family:"Young Serif",Georgia,serif;font-size:1.7rem;color:var(--ink);
        background:var(--key);box-shadow:inset 0 0 0 2px var(--card-line);transition:all .2s ease}
  .slot.filled{box-shadow:inset 0 0 0 2px var(--accent);transform:translateY(-2px)}
  .slots.bad .slot{box-shadow:inset 0 0 0 2px var(--bad);color:var(--bad)}
  .slots.good .slot{box-shadow:inset 0 0 0 2px var(--good);color:var(--good)}
  .code-msg{min-height:1.5em;margin:0 0 12px;font-size:.98rem;color:var(--muted)}
  .code-msg.bad{color:var(--bad);font-weight:500}
  .code-msg.good{color:var(--good);font-weight:500}
  .keypad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center}
  .key{height:56px;border-radius:18px;border:0;background:var(--key);color:var(--ink);cursor:pointer;
       font:500 1.35rem "Outfit",system-ui,sans-serif;transition:transform .12s ease,background .2s ease}
  .key:active{transform:scale(.93);background:var(--accent);color:var(--accent-ink)}
  .key:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .key.blank{visibility:hidden}

  /* ---------- Movimiento reducido ---------- */
  @media (prefers-reduced-motion: reduce){
    .stem{stroke-dashoffset:0;animation:none}
    .leaf{opacity:1;animation:none}
    .bloom{transform:scale(1);animation:none}
    .sprig,.petal,.reveal::after{animation:none}
    .petal{display:none}
    .stage.show .deck{animation:none;opacity:1}
    .stage.show .bday{animation:none;opacity:1}
    .stage.show #t0 .shine::before,.ticket.sweep .shine::before{animation:none !important}
    .eye.hint::after,.eye.pop{animation:none}
    .actions{transition:none}
    .modal,.card,.slide,.lock .shackle{transition:none}
    .card.shake{animation:none}
    .msg span{opacity:1;transform:none;animation:none !important}
  }
</style>
</head>
<body>

<svg id="field" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>

<main>
  <!-- Pantalla inicial -->
  <section class="hero" id="hero">
    <p class="love">Mi amor</p>
    <h1>Tengo algo para ti</h1>
    <p>Es algo que has soñado por mucho tiempo.</p>
    <button class="btn reveal" id="revealBtn" type="button">Ver mi sorpresa</button>
  </section>

  <!-- Regalos revelados -->
  <section class="stage" id="stage">
    <h2 class="bday">¡¡Feliz Cumpleaños Mi Reina!!</h2>

    <!-- Mazo de boletas: se cambia con el botón o deslizando -->
    <div class="deck" id="deck" aria-live="polite">
      <div class="ticket" id="t0">
        <img id="ticketImg" alt="Boleta: Te invito a cumplir tu sueño de ver a CAMILA en vivo. 27 de noviembre, Bogotá, El Corazón de Bogotá. Tú y yo.">
        <div class="shine"></div>
      </div>
      <div class="ticket" id="t1" hidden>
        <img id="bonoImg" alt="Bono válido para irte de compras. Monto oculto. Lugar: donde tú quieras.">
        <div class="shine"></div>
        <button class="eye hint" id="eyeBtn" type="button" aria-pressed="false" aria-label="Mostrar monto"></button>
      </div>
    </div>

    <div class="actions">
      <div class="dots" id="deckDots" aria-hidden="true"><span class="dot on"></span><span class="dot"></span></div>
      <div class="row">
        <button class="btn ghost" id="nextBtn" type="button">Ver otro regalo</button>
        <button class="btn" id="downloadBtn" type="button">Descargar boleta</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </div>
  </section>
</main>

<!-- Modal: mensaje + juego del código -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-hidden="true">
  <div class="card" id="card">
    <svg class="corner tl" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <svg class="corner br" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <button class="close" id="closeModal" type="button" aria-label="Cerrar">&times;</button>
    <div class="mdots" aria-hidden="true"><span class="mdot on"></span><span class="mdot"></span></div>

    <div class="slides">
      <!-- Slide 1: mensaje -->
      <section class="slide active" id="slide0">
        <h3 id="mTitle">Para ti, mi reina</h3>
        <p class="msg" id="loveMsg"></p>
        <button class="btn" id="nextSlide" type="button">Siguiente</button>
      </section>

      <!-- Slide 2: código -->
      <section class="slide" id="slide1" aria-labelledby="codeTitle">
        <svg class="lock" id="lock" viewBox="0 0 64 64" aria-hidden="true">
          <path class="shackle" d="M20 30V20a12 12 0 0 1 24 0v10" fill="none" stroke="#5B83C7" stroke-width="5" stroke-linecap="round"/>
          <rect x="11" y="28" width="42" height="30" rx="9" fill="#A9CBFF"/>
          <path d="M32 50s-8-4.6-8-10a4.4 4.4 0 0 1 8-2.4 4.4 4.4 0 0 1 8 2.4c0 5.4-8 10-8 10z" fill="#F7C9D9"/>
        </svg>
        <h4 class="code-title" id="codeTitle">Código que solo la cumpleañera sabe</h4>
        <div class="slots" id="slots" aria-hidden="true">
          <span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span>
        </div>
        <p class="code-msg" id="codeMsg" role="status" aria-live="polite"></p>
        <div class="keypad" id="keypad">
          <button class="key" type="button">1</button><button class="key" type="button">2</button><button class="key" type="button">3</button>
          <button class="key" type="button">4</button><button class="key" type="button">5</button><button class="key" type="button">6</button>
          <button class="key" type="button">7</button><button class="key" type="button">8</button><button class="key" type="button">9</button>
          <span class="key blank"></span><button class="key" type="button">0</button>
          <button class="key" type="button" data-del aria-label="Borrar">&#9003;</button>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
/* ===================== Utilidades ===================== */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const NS = "http://www.w3.org/2000/svg";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Paleta pastel con prioridad al azul (los azules aparecen repetidos para pesar más)
const PALETTE = ["#A9CBFF","#8DB8F2","#C4DBFF","#B4C8F6","#9EC3F7","#CDBDF2","#F7C9D9","#FFF1B8"];

function svgEl(tag, attrs) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/* ===================== Campo de flores SVG ===================== */
(function buildField() {
  const field = document.getElementById("field");
  const base = 430, count = 26;
  for (let i = 0; i < count; i++) {
    const x = 20 + i * (1160 / (count - 1)) + rand(-14, 14);
    const h = rand(110, 300);
    const tx = x + rand(-30, 30), ty = base - h;
    const cx = x + rand(-25, 25);

    const sprig = svgEl("g", { class: "sprig" });
    sprig.style.setProperty("--d", (i % 2 ? rand(.2, .9) : rand(0, .6)).toFixed(2) + "s");
    sprig.style.setProperty("--sway", rand(3.5, 6).toFixed(2) + "s");
    sprig.style.transformOrigin = `${x}px ${base}px`;

    // Tallo que se dibuja
    sprig.appendChild(svgEl("path", {
      class: "stem", pathLength: 1,
      d: `M${x} ${base} Q${cx} ${base - h * .5} ${tx} ${ty}`
    }));
    // Hoja a mitad del tallo
    const lx = (x + 2 * cx + tx) / 4, ly = base - h * .45;
    sprig.appendChild(svgEl("ellipse", {
      class: "leaf", cx: lx + 12, cy: ly, rx: 16, ry: 6,
      transform: `rotate(${rand(-40, -15)} ${lx} ${ly})`
    }));

    // Cabeza de la flor (5 u 8 pétalos)
    const head = svgEl("g", { transform: `translate(${tx} ${ty})` });
    const bloom = svgEl("g", { class: "bloom" });
    const color = pick(PALETTE);
    const n = Math.random() < .7 ? 5 : 8;
    const r = rand(16, 26);
    const rot = rand(0, 72);
    for (let p = 0; p < n; p++) {
      bloom.appendChild(svgEl("ellipse", {
        cx: 0, cy: -r * .55, rx: r * (n === 5 ? .42 : .26), ry: r * .58,
        fill: color, transform: `rotate(${rot + p * 360 / n})`
      }));
    }
    bloom.appendChild(svgEl("circle", { cx: 0, cy: 0, r: r * .22, fill: "#FFE7A3" }));
    head.appendChild(bloom);
    sprig.appendChild(head);
    field.appendChild(sprig);
  }
})();

/* ===================== Pétalos cayendo ===================== */
(function buildPetals() {
  if (reduceMotion) return;
  for (let i = 0; i < 16; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    p.style.left = rand(0, 100) + "vw";
    p.style.setProperty("--s", rand(8, 15) + "px");
    p.style.setProperty("--c", pick(PALETTE));
    p.style.setProperty("--t", rand(9, 16) + "s");
    p.style.setProperty("--delay", -rand(0, 16) + "s");
    p.style.setProperty("--drift", rand(-60, 60) + "px");
    document.body.appendChild(p);
  }
})();

/* ===================== Dibujo de la boleta en canvas ===================== */
// Se dibuja en canvas para que lo que se ve sea exactamente lo que se descarga.
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r); c.closePath();
}
function flower(c, cx, cy, r, col, n = 5, rot = 0) {
  c.save(); c.translate(cx, cy); c.rotate(rot);
  c.fillStyle = col;
  for (let i = 0; i < n; i++) {
    c.save(); c.rotate(i * Math.PI * 2 / n);
    c.beginPath(); c.ellipse(0, -r * .55, r * (n === 5 ? .42 : .26), r * .58, 0, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  c.fillStyle = "#FFE7A3"; c.beginPath(); c.arc(0, 0, r * .22, 0, Math.PI * 2); c.fill();
  c.restore();
}
function leaf(c, x, y, ang, len = 34) {
  c.save(); c.translate(x, y); c.rotate(ang); c.fillStyle = "#BFE3D0";
  c.beginPath(); c.ellipse(len / 2, 0, len / 2, len / 5, 0, 0, Math.PI * 2); c.fill(); c.restore();
}
function cluster(c, x, y, s = 1) {
  leaf(c, x - 10 * s, y + 30 * s, 2.4, 50 * s);
  leaf(c, x + 20 * s, y + 26 * s, .6, 44 * s);
  flower(c, x - 34 * s, y + 6 * s, 30 * s, "#A9CBFF", 5, .3);
  flower(c, x + 26 * s, y - 18 * s, 36 * s, "#8DB8F2", 5, 1.1);
  flower(c, x + 6 * s, y + 34 * s, 22 * s, "#F7C9D9", 8, .2);
  flower(c, x - 6 * s, y - 40 * s, 18 * s, "#CDBDF2", 5, .7);
}
function fitText(c, text, maxW, size, family) {
  c.font = `${size}px ${family}`;
  while (c.measureText(text).width > maxW && size > 20) { size -= 4; c.font = `${size}px ${family}`; }
}

/* ---------- Base común de las boletas ---------- */
const TW = 900, TH = 1500, CUT = 1130, TR = 46, SCALE = 1.5;

// Crea el lienzo con la forma, fondos y flores de esquina
function ticketBase({ top0, top1, stub0, stub1, blobs }) {
  const cv = document.createElement("canvas");
  cv.width = TW * SCALE; cv.height = TH * SCALE;
  const c = cv.getContext("2d");
  c.scale(SCALE, SCALE);

  c.save(); roundRect(c, 0, 0, TW, TH, TR); c.clip();
  let g = c.createLinearGradient(0, 0, 0, CUT);
  g.addColorStop(0, top0); g.addColorStop(1, top1);
  c.fillStyle = g; c.fillRect(0, 0, TW, CUT);
  blobs.forEach(([x, y, r, col]) => {               // manchas suaves de color
    const rg = c.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, col); rg.addColorStop(1, "rgba(255,255,255,0)");
    c.fillStyle = rg; c.fillRect(0, 0, TW, CUT);
  });
  g = c.createLinearGradient(0, CUT, 0, TH);         // talón
  g.addColorStop(0, stub0); g.addColorStop(1, stub1);
  c.fillStyle = g; c.fillRect(0, CUT, TW, TH - CUT);
  cluster(c, 70, 80, 1.05);
  cluster(c, 840, 90, 1.15);
  cluster(c, 830, 1060, .8);
  c.restore();

  c.strokeStyle = "rgba(46,74,125,.18)"; c.lineWidth = 2;   // borde interior
  roundRect(c, 26, 26, TW - 52, CUT - 86, 30); c.stroke();
  return { cv, c };
}

// Muescas, perforación, título del talón, código de barras y pie
function ticketStub(c, script, footer, seed) {
  c.save(); c.globalCompositeOperation = "destination-out";
  [0, TW].forEach(x => { c.beginPath(); c.arc(x, CUT, 40, 0, Math.PI * 2); c.fill(); });
  c.restore();
  c.setLineDash([14, 12]); c.strokeStyle = "rgba(255,255,255,.6)"; c.lineWidth = 3;
  c.beginPath(); c.moveTo(56, CUT); c.lineTo(TW - 56, CUT); c.stroke(); c.setLineDash([]);

  c.textAlign = "center"; c.fillStyle = "#FFFFFF";
  c.font = '124px "Pinyon Script", cursive';
  c.fillText(script, TW / 2, 1262);

  c.fillStyle = "rgba(255,255,255,.88)";               // código de barras decorativo
  let bx = 160;
  while (bx < 740) {
    seed = (seed * 9301 + 49297) % 233280;
    const w = 2 + (seed % 5);
    c.fillRect(bx, 1300, w, 86);
    bx += w + 3 + (seed % 4);
  }
  c.fillStyle = "rgba(255,255,255,.8)"; c.font = '500 26px Outfit, sans-serif';
  c.fillText(footer, TW / 2, 1448);
}

function smallCaps(c, text, y) {
  c.textAlign = "center"; c.fillStyle = "#6F86B3"; c.font = '500 26px Outfit, sans-serif';
  if ("letterSpacing" in c) c.letterSpacing = "6px";
  c.fillText(text, TW / 2, y);
  if ("letterSpacing" in c) c.letterSpacing = "0px";
}
function divider(c, y) {
  c.strokeStyle = "rgba(46,74,125,.22)"; c.lineWidth = 2;
  c.beginPath(); c.moveTo(130, y); c.lineTo(410, y); c.moveTo(490, y); c.lineTo(770, y); c.stroke();
  flower(c, 450, y, 22, "#A9CBFF", 5, .4);
}
const label = (c, t, x, y) => { c.textAlign = "left"; c.fillStyle = "#6F86B3"; c.font = '500 26px Outfit, sans-serif'; c.fillText(t, x, y); };
const value = (c, t, x, y) => { c.textAlign = "left"; c.fillStyle = "#2E4A7D"; c.font = '500 52px Fraunces, Georgia, serif'; c.fillText(t, x, y); };

/* ---------- Boleta 1: concierto ---------- */
function drawTicket() {

    top0: "#D3E4FF", top1: "#F5F9FF", stub0: "#3C5E9A", stub1: "#2A4373",
    blobs: [[150, 220, 260, "rgba(205,189,242,.35)"], [780, 520, 300, "rgba(247,201,217,.28)"], [300, 900, 320, "rgba(169,203,255,.35)"]]
  });
  smallCaps(c, "Pase para dos", 140);

  c.textAlign = "center";
  c.fillStyle = "#3D5A8F"; c.font = 'italic 300 54px Fraunces, Georgia, serif';
  c.fillText("Te invito a cumplir", TW / 2, 260);
  c.fillText("tu sueño de ver a", TW / 2, 326);

  fitText(c, "CAMILA", 780, 184, '"Young Serif", Georgia, serif');
  const g = c.createLinearGradient(0, 360, 0, 510);
  g.addColorStop(0, "#5B83C7"); g.addColorStop(1, "#2E4A7D");
  c.fillStyle = g; c.fillText("CAMILA", TW / 2, 505);

  c.fillStyle = "#7FA9EC"; c.font = '96px "Pinyon Script", cursive';
  c.fillText("en vivo", TW / 2, 610);

  label(c, "Fecha", 120, 790);  value(c, "27 de noviembre", 120, 852);

  label(c, "Lugar", 120, 940);  value(c, "El Corazón de Bogotá", 120, 1002);

  ticketStub(c, "Tú & Yo", "Fila 5      Asiento: a tu lado", 27112026);
  return cv;
}

/* ---------- Boleta 2: bono de compras ---------- */
function sparkle(c, x, y, r, col) {                     // estrellita de 4 puntas
  c.save(); c.translate(x, y); c.fillStyle = col; c.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, rr = i % 2 ? r * .32 : r;
    c.lineTo(Math.sin(a) * rr, -Math.cos(a) * rr);
  }
  c.closePath(); c.fill(); c.restore();
}
function shoppingBag(c, cx, top) {
  const w = 250, h = 200, x = cx - w / 2;
  c.strokeStyle = "#5B83C7"; c.lineWidth = 12; c.lineCap = "round";   // asas
  c.beginPath(); c.arc(cx - 45, top, 34, Math.PI, 0); c.stroke();
  c.beginPath(); c.arc(cx + 45, top, 34, Math.PI, 0); c.stroke();
  const g = c.createLinearGradient(0, top, 0, top + h);                 // cuerpo
  g.addColorStop(0, "#A9CBFF"); g.addColorStop(1, "#7FA9EC");
  c.fillStyle = g; roundRect(c, x, top, w, h, 26); c.fill();
  c.fillStyle = "rgba(255,255,255,.25)"; roundRect(c, x, top, w, 34, 16); c.fill();
  flower(c, cx, top + 112, 46, "#F7FBFF", 5, .5);                       // flor en la bolsa
  sparkle(c, cx - 175, top - 10, 22, "#F7C9D9");
  sparkle(c, cx + 170, top + 40, 28, "#CDBDF2");
  sparkle(c, cx + 140, top - 60, 16, "#FFE7A3");
}
function drawBono(revealed) {
  const { cv, c } = ticketBase({
    top0: "#DCE6FF", top1: "#F6F8FF", stub0: "#5C78C4", stub1: "#3B5597",
    blobs: [[760, 240, 280, "rgba(247,201,217,.32)"], [140, 560, 300, "rgba(205,189,242,.35)"], [620, 960, 300, "rgba(169,203,255,.35)"]]
  });
  smallCaps(c, "Un regalo más", 140);

  c.textAlign = "center";
  c.fillStyle = "#3D5A8F"; c.font = 'italic 300 54px Fraunces, Georgia, serif';
  c.fillText("Bono válido para", TW / 2, 260);
  c.fillText("irte de compras", TW / 2, 326);

  shoppingBag(c, TW / 2, 420);
  divider(c, 690);

  // Campo del monto: caja suave + asteriscos u "Por definir"
  label(c, "Monto", 120, 775);
  c.fillStyle = "rgba(255,255,255,.75)"; roundRect(c, 105, 795, 690, 100, 26); c.fill();
  c.strokeStyle = "rgba(127,169,236,.45)"; c.lineWidth = 2; c.stroke();
  if (revealed) {
    value(c, "POR DEFINIR", 140, 864);
  } else {
    c.textAlign = "left"; c.fillStyle = "#2E4A7D"; c.font = '64px "Young Serif", Georgia, serif';
    if ("letterSpacing" in c) c.letterSpacing = "14px";
    c.fillText("*****", 140, 885);
    if ("letterSpacing" in c) c.letterSpacing = "0px";
  }

  label(c, "Lugar", 120, 960); value(c, "Donde tú quieras", 120, 1022);

  ticketStub(c, "Para mi reina", "Regalo 2 de 2", 12112026);
  return cv;
}

/* ===================== Revelar ===================== */
function burst(fromEl, count = 38) {
  if (reduceMotion) return;
  const r = fromEl.getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  for (let i = 0; i < count; i++) {
    const p = document.createElement("span");
    const s = rand(8, 16);
    Object.assign(p.style, {
      position: "fixed", left: ox + "px", top: oy + "px", width: s + "px", height: s + "px",
      background: pick(PALETTE), borderRadius: "80% 0 80% 0", zIndex: 5, pointerEvents: "none"
    });
    document.body.appendChild(p);
    const a = rand(0, Math.PI * 2), d = rand(120, 380);
    p.animate([
      { transform: "translate(-50%,-50%) rotate(0) scale(1)", opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d + 80}px)) rotate(${rand(180, 540)}deg) scale(.6)`, opacity: 0 }
    ], { duration: rand(1000, 1600), easing: "cubic-bezier(.15,.7,.3,1)" }).onfinish = () => p.remove();
  }
}

function setSlide(i) {
  slides.forEach((s, k) => {
    s.classList.toggle("active", k === i);
    s.classList.toggle("gone", k < i);
    s.inert = k !== i;
  });
  mdots.forEach((d, k) => d.classList.toggle("on", k === i));
  slideIdx = i;
}

function openModal() {
  setSlide(0);
  resetCode();
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  setTimeout(() => document.getElementById("nextSlide").focus(), 350);
}
function closeModal() {
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  revealBtn.disabled = false;
  revealBtn.focus();
}

revealBtn.addEventListener("click", () => {

  burst(revealBtn, 24);

const SECRET = "1114";
const slotEls = document.querySelectorAll(".slot");
const slotsBox = document.getElementById("slots");
const codeMsg = document.getElementById("codeMsg");
const lock = document.getElementById("lock");
let code = "", locked = false;

function renderSlots() {
  slotEls.forEach((el, i) => {
    el.textContent = code[i] || "";
    el.classList.toggle("filled", i < code.length);
  });
}
function resetCode() {
  code = ""; locked = false;
  slotsBox.classList.remove("bad", "good");
  codeMsg.textContent = ""; codeMsg.className = "code-msg";
  lock.classList.remove("open");
  renderSlots();
}
function press(k) {
  if (locked) return;
  if (k === "del") { code = code.slice(0, -1); }
  else if (code.length < 4) { code += k; }
  slotsBox.classList.remove("bad");
  if (codeMsg.classList.contains("bad")) { codeMsg.textContent = ""; codeMsg.className = "code-msg"; }
  renderSlots();
  if (code.length === 4) setTimeout(check, 180);
}
function check() {
  if (code === SECRET) {
    // Acierto: candado abierto, pétalos y pasa a los cupones
    locked = true;
    slotsBox.classList.add("good");
    lock.classList.add("open");
    codeMsg.textContent = "¡Correcto, mi reina!";
    codeMsg.className = "code-msg good";
    burst(lock, 40);
    setTimeout(() => {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      showGifts();
    }, reduceMotion ? 600 : 1300);
  } else {
    // Error: tiembla y se limpia
    locked = true;
    slotsBox.classList.add("bad");
    codeMsg.textContent = "Upsssss, intenta nuevamente mi amor";
    codeMsg.className = "code-msg bad";
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(() => { code = ""; locked = false; renderSlots(); slotsBox.classList.remove("bad"); }, 800);
  }
}
document.getElementById("keypad").addEventListener("click", e => {
  const b = e.target.closest("button.key");
  if (b) press(b.hasAttribute("data-del") ? "del" : b.textContent.trim());
});
// Teclado físico (computador)
document.addEventListener("keydown", e => {
  if (!modal.classList.contains("open")) return;
  if (e.key === "Escape") return closeModal();
  if (slideIdx !== 1) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === "Backspace") press("del");
});

/* ===================== Cambiar de regalo ===================== */
const tickets = [document.getElementById("t0"), document.getElementById("t1")];
const dots = document.querySelectorAll("#deckDots .dot");
const nextBtn = document.getElementById("nextBtn");
const downloadBtn = document.getElementById("downloadBtn");
const status = document.getElementById("status");
const DL_LABELS = ["Descargar boleta", "Descargar bono"];
let current = 0, busy = false;

function goTo(to) {
  if (to === current || busy) return;
  const dir = to > current ? 1 : -1;
  const out = tickets[current], inn = tickets[to];
  current = to;
  dots.forEach((d, i) => d.classList.toggle("on", i === to));
  downloadBtn.textContent = DL_LABELS[to];
  status.textContent = "";

  inn.hidden = false;
  if (reduceMotion) { out.hidden = true; return; }
  busy = true;
  // Sale la actual hacia un lado, entra la otra desde el lado contrario
  out.animate([
    { transform: "none", opacity: 1 },
    { transform: `translateX(${-dir * 70}%) rotate(${-dir * 10}deg) scale(.9)`, opacity: 0 }
  ], { duration: 420, easing: "cubic-bezier(.5,0,.75,0)" }).onfinish = () => { out.hidden = true; };
  inn.animate([
    { transform: `translateX(${dir * 70}%) rotate(${dir * 10}deg) scale(.9)`, opacity: 0 },
    { transform: "none", opacity: 1 }
  ], { duration: 620, delay: 220, easing: "cubic-bezier(.2,.9,.25,1.12)", fill: "backwards" })
    .onfinish = () => { busy = false; };
  // Repite el brillo sobre la boleta que entra
  inn.classList.remove("sweep"); void inn.offsetWidth; inn.classList.add("sweep");
  if (to === 1) burst(nextBtn, 24);
}

nextBtn.addEventListener("click", () => goTo(current === 0 ? 1 : 0));

// Deslizar con el dedo para cambiar
let touchX = null;
const deck = document.getElementById("deck");
deck.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
deck.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) goTo(dx < 0 ? 1 : 0);
  touchX = null;
}, { passive: true });

/* ===================== Descargar ===================== */
downloadBtn.addEventListener("click", async () => {
  const cv = current === 0 ? canvases.ticket : (revealed ? canvases.bonoShown : canvases.bonoHidden);
  const FILENAME = current === 0 ? "boleta-camila-27-noviembre.png" : "bono-de-compras.png";
  downloadBtn.disabled = true; downloadBtn.textContent = "Preparando…";
  try {
    const blob = await new Promise(res => cv.toBlob(res, "image/png"));
    await downloadsReady;

    // 0) Dentro de claude.ai: descarga del visor
    if (claudeDownloads) {
      try {
        await claudeDownloads.save({ filename: FILENAME, data: blob });
        status.textContent = "Guardado.";
      } catch (err) {
        status.textContent = err && err.code === "declined"
          ? "No se guardó. Puedes intentarlo de nuevo."
          : "Mantén presionada la imagen (o clic derecho) para guardarla.";
      }
      return;
    }

    // 1) Celulares: menú nativo de compartir/guardar (permite "Guardar imagen" en iPhone)
    const file = new File([blob], FILENAME, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "Mi regalo" });
        status.textContent = "Listo.";
        return;
      } catch (err) {
        if (err && err.name === "AbortError") { status.textContent = ""; return; } // canceló el menú
      }
    }

    // 2) Computador / Android: descarga directa del archivo
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = FILENAME;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    status.textContent = "Descargado.";
  } catch {
    // 3) Respaldo: guardar manualmente
    status.textContent = "Mantén presionada la imagen (o clic derecho) para guardarla.";
  } finally {
    downloadBtn.disabled = false; downloadBtn.textContent = DL_LABELS[current];
  }
});
</script>
</body>
</html>
